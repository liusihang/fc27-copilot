<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FC27 Copilot Status</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;max-width:700px;margin:50px auto;padding:0 20px;background:#111318;color:#f2f4f6}.box{border:1px solid #303640;border-radius:12px;padding:18px;background:#181b21}.ok{color:#89e6a5}.bad{color:#ff9ca8}pre{white-space:pre-wrap;background:#0d0f13;padding:12px;border-radius:8px;max-height:420px;overflow:auto;font-size:12px}
  </style>
</head>
<body>
  <h1>FC27 Copilot Status</h1>
  <div class="box">
    <p>fc27d: <b id="daemonState" class="bad">checking</b></p>
    <p>Extension bridge: <b id="bridgeState" class="bad">checking</b></p>
    <p><small>The extension connects directly to this server. Open the FC27 Web App and sign in; this page is optional.</small></p>
    <pre id="health"></pre>
  </div>
<script>
const daemonState=document.getElementById('daemonState');
const bridgeState=document.getElementById('bridgeState');
const health=document.getElementById('health');
async function refresh(){
  try{
    const response=await fetch('/health',{cache:'no-store'});
    const value=await response.json();
    daemonState.textContent=value.ok?'healthy':'error';
    daemonState.className=value.ok?'ok':'bad';
    const connected=Boolean(value.browser_bridge?.connected);
    bridgeState.textContent=connected?'connected':'waiting for extension';
    bridgeState.className=connected?'ok':'bad';
    health.textContent=JSON.stringify(value,null,2);
  }catch(error){
    daemonState.textContent='unreachable';
    daemonState.className='bad';
    health.textContent=error.message;
  }
}
refresh();
setInterval(refresh,3000);
</script>
</body>
</html>
