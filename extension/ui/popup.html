<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FC27 Copilot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>FC27 Copilot <span>Bridge</span></h1>
    <p class="sub">Open the FC27 Web App and sign in. The extension connects to fc27d and synchronizes your club automatically.</p>

    <section>
      <div class="row"><b>Web App</b><span id="webapp" class="badge">Checking</span></div>
      <div class="row"><b>Session</b><span id="session" class="badge">Checking</span></div>
      <div class="kv"><span>Game</span><code id="game">—</code></div>
      <div class="kv"><span>API host</span><code id="host">—</code></div>
      <div class="kv"><span>API base</span><code id="base">—</code></div>
      <div class="kv"><span>SID captured</span><code id="sid">—</code></div>
      <div class="kv"><span>Phishing token</span><code id="phishing">—</code></div>
    </section>

    <section>
      <div class="row"><b>fc27d</b><span id="daemon" class="badge">Checking</span></div>
      <div class="kv"><span>Auto sync</span><code id="autoSync">—</code></div>
      <label for="serverUrl">FC27 server</label>
      <input id="serverUrl" type="url" spellcheck="false" value="http://127.0.0.1:3926" />
      <button id="saveServer" class="secondary">Save server address</button>
      <div id="lastError" class="error"></div>
    </section>

    <button id="refresh">Refresh status</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
